name: Archive macos-update

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  zip-and-archive:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run tests
        run: zsh -n update.sh && zsh -n install.sh && zsh tests/test_update.sh

      - name: Create zip archive
        run: |
          zip -r macos-update.zip update.sh com.marsegm.dailyupdate.plist install.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-update-archive
          path: macos-update.zip
